# This managed block is inserted inside the existing cosmosXmachina Apache
# VirtualHost. TLS and Certbot directives remain owned by the server.
# BEGIN COSMOS APACHE PRIVATE LOG
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^ https://@DOMAIN@%{REQUEST_URI} [R=301,L,NE]
CustomLog "/dev/null" combined
# END COSMOS APACHE PRIVATE LOG

# BEGIN COSMOS APACHE DELIVERY
DocumentRoot "@COSMOS_ROOT@/current/dist"
DirectoryIndex index.html
TraceEnable Off

# Enforce the public surface before aliases or filesystem mapping. The release
# contains only these routes, but this also neutralizes stale legacy aliases.
RewriteEngine On
RewriteCond %{HTTP_HOST} =@WWW_DOMAIN@ [NC]
RewriteRule ^ https://@DOMAIN@%{REQUEST_URI} [R=301,L,NE]
RewriteCond %{REQUEST_URI} !^/$
RewriteCond %{REQUEST_URI} !^/(?:index\.html|privacy\.html|robots\.txt|sitemap\.xml)$ [NC]
RewriteCond %{REQUEST_URI} !^/assets/[A-Za-z0-9_./-]+\.(?:css|js|mjs|svg|webp|jpe?g|png|woff2)$ [NC]
RewriteCond %{REQUEST_URI} !^/portfolio(?:/(?:document-operations|operations-hub|knowledge-assistant|kpi-studio))?/?(?:index\.html)?$ [NC]
RewriteCond %{REQUEST_URI} !^/api(?:/|$) [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/ [NC]
RewriteRule ^ - [F,L]

ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 15
ProxyPass "/api/" "http://127.0.0.1:8787/api/" connectiontimeout=5 timeout=15 retry=0
ProxyPassReverse "/api/" "http://127.0.0.1:8787/api/"

<Directory "@COSMOS_ROOT@">
    Require all denied
</Directory>

<Directory "@COSMOS_ROOT@/current/dist">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<Location "/api/">
    LimitRequestBody 65536
    Require all granted
</Location>

FileETag MTime Size
AddOutputFilterByType DEFLATE text/plain text/css application/json application/javascript application/xml image/svg+xml
ExpiresActive On
ExpiresByType text/css "access plus 7 days"
ExpiresByType application/javascript "access plus 7 days"
ExpiresByType image/svg+xml "access plus 7 days"
ExpiresByType image/webp "access plus 7 days"
ExpiresByType image/jpeg "access plus 7 days"
ExpiresByType image/png "access plus 7 days"
ExpiresByType font/woff2 "access plus 7 days"

<FilesMatch "\.(?:css|js|mjs|svg|webp|jpe?g|png|woff2)$">
    Header set Cache-Control "public, max-age=604800"
</FilesMatch>
<FilesMatch "\.html$">
    Header set Cache-Control "no-cache"
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

# The normal vhost log is discarded. Only successful top-level document
# navigations survive Node validation; the address is used in RAM for one hour.
SetEnvIf Sec-Fetch-Dest "^document$" cosmos_document
LogFormat "COSMOS_VISIT %a %>s %m %{Sec-Fetch-Dest}i %U" cosmos_visit
CustomLog "/dev/null" combined
CustomLog "|/usr/bin/logger --server 127.0.0.1 --udp --port 5514 --tag cosmos_visit" cosmos_visit env=cosmos_document
# END COSMOS APACHE DELIVERY
