<!DOCTYPE html>
<html lang="en">
<!--
  DESIGN CONCEPT:
  This webpage creates an immersive cosmic experience featuring a deep space background
  with dynamic elements including stars, nebulae, and geometric patterns.
  
  The design aims to evoke a sense of wonder about the intersection of cosmic imagery
  and digital/technological elements - hence "COSMOS EX MACHINA" (Universe from the Machine).
  
  Key visual elements include:
  - Deep space gradient background transitioning from purples to black
  - Procedurally generated stars with twinkling animations
  - Colorful nebula formations using radial gradients
  - Geometric patterns suggesting higher dimensions
  - Futuristic typography with glow effects
  
  This design is intended to serve as a foundation that can be expanded with additional
  content sections, interactive elements, or animation sequences.
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Page title that appears in browser tabs -->
  <title>COSMOS EX MACHINA</title>
  <style>
    /* Import futuristic font from Google Fonts - Orbitron provides a clean tech aesthetic that suits the cosmic theme */
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    
    /* Reset default browser margins and padding, prevent scrollbars unless needed */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
    }
    
    /* Main container - relative positioning is needed for absolute positioning of child elements */
    .container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000; /* Fallback color in case SVG doesn't load */
    }
    
    /* SVG cosmic background - absolute positioning ensures it fills the entire viewport */
    .cosmic-background {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 1; /* Lower z-index keeps background behind the text content */
    }
    
    /* Title container - centered with absolute positioning and transform */
    .title-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%); /* Center perfectly regardless of content size */
      z-index: 2; /* Higher z-index ensures text appears above the background */
      text-align: center;
      width: 100%;
    }
    
    /* Title styling - uses gradient text, shadow effects and animation for visual interest */
    .title {
      font-size: 5vw; /* Responsive font size based on viewport width */
      font-weight: bold;
      color: #fff; /* Fallback color if gradient doesn't work */
      text-shadow: 0 0 10px rgba(116, 182, 255, 0.8),
                   0 0 20px rgba(94, 151, 255, 0.6),
                   0 0 30px rgba(65, 129, 255, 0.4);
      letter-spacing: 5px; /* Increased letter spacing for a more dramatic look */
      background: linear-gradient(to right, #37d5d6, #36096d); /* Teal to purple gradient */
      -webkit-background-clip: text; /* Makes the gradient only apply to text characters */
      background-clip: text;
      color: transparent; /* Makes text transparent so gradient shows through */
      animation: pulsate 3s infinite alternate; /* Subtle pulsing animation */
    }
    
    /* Pulsate animation - subtle glow effect that adds depth and visual interest */
    @keyframes pulsate {
      0% {
        text-shadow: 0 0 10px rgba(116, 182, 255, 0.8),
                     0 0 20px rgba(94, 151, 255, 0.6),
                     0 0 30px rgba(65, 129, 255, 0.4);
      }
      100% {
        text-shadow: 0 0 15px rgba(116, 182, 255, 0.9),
                     0 0 25px rgba(94, 151, 255, 0.7),
                     0 0 35px rgba(65, 129, 255, 0.5),
                     0 0 45px rgba(44, 111, 255, 0.3);
      }
    }

    /* Subtitle styling - more subtle than the main title but maintains design cohesion */
    .subtitle {
      font-size: 1.5vw; /* Responsive font size */
      color: rgba(255, 255, 255, 0.7); /* Semi-transparent white for contrast against dark background */
      margin-top: 20px;
      letter-spacing: 2px; /* Increased spacing for readability and style */
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- SVG element that creates the cosmic background - using SVG for vector graphics that scale perfectly -->
    <svg class="cosmic-background" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Radial gradient creates depth in the cosmic background - transitions from purple center to black edges -->
        <radialGradient id="cosmos-gradient" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
          <stop offset="0%" stop-color="#1a0033" /> <!-- Deep purple at center -->
          <stop offset="40%" stop-color="#0c001f" /> <!-- Darker purple mid-way -->
          <stop offset="90%" stop-color="#000005" /> <!-- Near black at outer edges -->
          <stop offset="100%" stop-color="#000000" /> <!-- Pure black at furthest edges -->
        </radialGradient>
        
        <!-- Star glow filter - creates soft glow around stars for more realistic appearance -->
        <filter id="star-glow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="2" result="blur" /> <!-- Blur effect creates the glow -->
          <feComposite in="SourceGraphic" in2="blur" operator="over" /> <!-- Composites original star on top of glow -->
        </filter>

        <!-- First nebula formation - purple tones positioned in top-left area -->
        <radialGradient id="nebula1" cx="30%" cy="30%" r="50%" fx="30%" fy="30%">
          <stop offset="0%" stop-color="rgba(114, 9, 183, 0.6)" /> <!-- Semi-transparent purple center -->
          <stop offset="50%" stop-color="rgba(86, 11, 173, 0.4)" /> <!-- Less opaque mid-way -->
          <stop offset="100%" stop-color="rgba(58, 12, 163, 0)" /> <!-- Fully transparent at edges for smooth fade -->
        </radialGradient>

        <!-- Second nebula formation - blue tones positioned in bottom-right area -->
        <radialGradient id="nebula2" cx="70%" cy="60%" r="40%" fx="70%" fy="60%">
          <stop offset="0%" stop-color="rgba(11, 72, 107, 0.6)" /> <!-- Semi-transparent blue center -->
          <stop offset="60%" stop-color="rgba(17, 85, 123, 0.3)" /> <!-- Less opaque mid-way -->
          <stop offset="100%" stop-color="rgba(23, 97, 139, 0)" /> <!-- Fully transparent at edges -->
        </radialGradient>

        <!-- Hypergeometric pattern - creates subtle grid-like structure suggesting higher dimensions -->
        <pattern id="hypergeometric" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="100" y2="100" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.5" /> <!-- Diagonal line -->
          <line x1="100" y1="0" x2="0" y2="100" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.5" /> <!-- Opposing diagonal line -->
          <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="0.5" /> <!-- Central circle -->
          <polygon points="50,10 90,50 50,90 10,50" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="0.5" /> <!-- Diamond shape -->
        </pattern>
      </defs>
      
      <!-- Base background filled with cosmos gradient - covers entire SVG area -->
      <rect width="100%" height="100%" fill="url(#cosmos-gradient)" />
      
      <!-- Nebula formations - semi-transparent colored areas that add depth and visual interest -->
      <ellipse cx="30%" cy="30%" rx="40%" ry="30%" fill="url(#nebula1)" opacity="0.7" /> <!-- Purple nebula in top-left quadrant -->
      <ellipse cx="70%" cy="60%" rx="35%" ry="25%" fill="url(#nebula2)" opacity="0.6" /> <!-- Blue nebula in bottom-right area -->
      
      <!-- Hypergeometric pattern overlay - subtle geometric shapes suggesting higher dimensions -->
      <rect width="100%" height="100%" fill="url(#hypergeometric)" opacity="0.3" />
      
      <!-- JavaScript dynamically generates stars and geometric shapes -->
      <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
          const svg = document.querySelector('.cosmic-background');
          const width = window.innerWidth;
          const height = window.innerHeight;
          
          // Generate random stars across the viewport
          // We create 200 stars of different sizes, opacities, and with optional animations
          for (let i = 0; i < 200; i++) {
            const x = Math.random() * width; // Random x position
            const y = Math.random() * height; // Random y position
            const radius = Math.random() * 1.5 + 0.5; // Random size between 0.5 and 2
            const opacity = Math.random() * 0.8 + 0.2; // Random opacity between 0.2 and 1
            
            // Create star as SVG circle
            const star = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            star.setAttribute("cx", x);
            star.setAttribute("cy", y);
            star.setAttribute("r", radius);
            star.setAttribute("fill", "white");
            star.setAttribute("opacity", opacity);
            
            // Randomly apply glow effect and twinkling animation to some stars (30%)
            // This creates visual variety and a more realistic star field
            if (Math.random() > 0.7) {
              star.setAttribute("filter", "url(#star-glow)");
              
              // Create twinkling animation by changing opacity over time
              const animate = document.createElementNS("http://www.w3.org/2000/svg", "animate");
              animate.setAttribute("attributeName", "opacity");
              animate.setAttribute("values", `${opacity};${opacity/2};${opacity}`); // Fade in and out
              animate.setAttribute("dur", `${Math.random() * 5 + 2}s`); // Random duration between 2-7s
              animate.setAttribute("repeatCount", "indefinite"); // Loop forever
              star.appendChild(animate);
            }
            
            svg.appendChild(star);
          }
          
          // Generate geometric shapes that suggest hyperdimensional space
          // These shapes rotate slowly to create subtle movement
          for (let i = 0; i < 10; i++) {
            const x = Math.random() * width; // Random x position
            const y = Math.random() * height; // Random y position
            const size = Math.random() * 100 + 50; // Random size between 50-150
            const opacity = Math.random() * 0.1 + 0.05; // Very subtle opacity
            
            // Create polygon shape (3-6 sides)
            const shape = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            
            // Generate points for regular polygon
            const points = [];
            const sides = Math.floor(Math.random() * 4) + 3; // Random 3-6 sided shape
            for (let j = 0; j < sides; j++) {
              const angle = (j / sides) * Math.PI * 2; // Evenly distribute points around circle
              const ptX = x + size * Math.cos(angle); // X coordinate on circle
              const ptY = y + size * Math.sin(angle); // Y coordinate on circle
              points.push(`${ptX},${ptY}`);
            }
            
            // Set polygon attributes
            shape.setAttribute("points", points.join(" "));
            shape.setAttribute("fill", "none"); // Transparent fill
            shape.setAttribute("stroke", "rgba(255, 255, 255, 0.15)"); // Subtle white outline
            shape.setAttribute("stroke-width", "0.5"); // Thin stroke
            shape.setAttribute("opacity", opacity); // Very subtle appearance
            
            // Add rotation animation for subtle movement
            // Each shape rotates at different speeds for visual variety
            const animateTransform = document.createElementNS("http://www.w3.org/2000/svg", "animateTransform");
            animateTransform.setAttribute("attributeName", "transform");
            animateTransform.setAttribute("type", "rotate");
            animateTransform.setAttribute("from", `0 ${x} ${y}`); // Start at 0 degrees
            animateTransform.setAttribute("to", `360 ${x} ${y}`); // Rotate full circle
            animateTransform.setAttribute("dur", `${Math.random() * 100 + 100}s`); // Very slow rotation (100-200s)
            animateTransform.setAttribute("repeatCount", "indefinite"); // Loop forever
            shape.appendChild(animateTransform);
            
            svg.appendChild(shape);
          }
        });
      </script>
    </svg>
    
    <!-- Title container - holds the main text elements centered in the viewport -->
    <div class="title-container">
      <h1 class="title">COSMOS EX MACHINA</h1>
      <p class="subtitle">DIGITAL UNIVERSE INTERVENTIONS</p>
    </div>
  </div>
</body>
</html>
