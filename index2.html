<!DOCTYPE html>
<html lang="en">
<!--
  DESIGN CONCEPT:
  This webpage creates an immersive cosmic experience featuring a deep space background
  with dynamic elements including stars, nebulae, and increasingly complex geometric patterns.
  
  MODIFICATIONS (New Version):
  1. Chaotic geometries are now far more diverse – each shape is a randomly generated irregular
     polygon (with some internal crossing lines) that orbits slowly around the center of the page.
     Their orbital speed is varied (some moving at half, one third, or even less than the base speed).
     Their size is also varied (scaled 1×, 2×, 3×, or 4×) and each is assigned a unique opacity (between 0.1 and 0.35).
     In addition, when the mouse comes within 20 pixels of a shape’s center, its inner part begins
     to rotate on its own axis and inverts direction every second while the pointer remains close.
  
  2. The previous small fractal flower‑of‑life overlay has been removed.
  
  3. Six big Flower‑of‑Life patterns have been added. Each is built using the classic seven‑circle motif,
     is given a unique starting color from a six‐color palette, and its opacity is randomly set between 0.1 and 0.35.
     They float around the page at speeds that vary from the current base speed up to 4× that speed.
     For mouse interaction, the distance is computed from the mouse pointer to the border of the flower,
     defined as the circumference of a circle with the flower’s center and a radius equal to 20×(flower’s scale).
     When the mouse gets within that distance, the flower floats away.
  
  4. Stars, nebulae, and the mouse‑interactive star sparkle remain unchanged.
  
  All sections are thoroughly commented to ensure clarity and facilitate future development.
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMOS EX MACHINA</title>
  <style>
    /* Import futuristic font from Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    
    /* Reset margins/padding; default cursor visible */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
    }
    
    .container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000; /* Fallback background */
    }
    
    /* SVG cosmic background container */
    .cosmic-background {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    /* Title container */
    .title-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      width: 100%;
    }
    
    .title {
      font-size: 5vw;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 10px rgba(116,182,255,0.8),
                   0 0 20px rgba(94,151,255,0.6),
                   0 0 30px rgba(65,129,255,0.4);
      letter-spacing: 5px;
      background: linear-gradient(to right, #37d5d6, #36096d);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: pulsate 3s infinite alternate;
    }
    
    .subtitle {
      font-size: 1.5vw;
      color: rgba(255,255,255,0.7);
      margin-top: 20px;
      letter-spacing: 2px;
    }
    
    @keyframes pulsate {
      0% {
        text-shadow: 0 0 10px rgba(116,182,255,0.8),
                     0 0 20px rgba(94,151,255,0.6),
                     0 0 30px rgba(65,129,255,0.4);
      }
      100% {
        text-shadow: 0 0 15px rgba(116,182,255,0.9),
                     0 0 25px rgba(94,151,255,0.7),
                     0 0 35px rgba(65,129,255,0.5),
                     0 0 45px rgba(44,111,255,0.3);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- SVG container with layers for nebula, stars, big flowers, and chaotic geometry -->
    <svg class="cosmic-background" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Radial gradient for cosmic background -->
        <radialGradient id="cosmos-gradient" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
          <stop offset="0%" stop-color="#1a0033" /> <!-- Deep purple at center -->
          <stop offset="40%" stop-color="#0c001f" /> <!-- Darker purple mid-way -->
          <stop offset="90%" stop-color="#0e0b30" /> <!-- Near black at outer edges -->
          <stop offset="100%" stop-color="#07051a" /> <!-- Pure black at furthest edges -->
        </radialGradient>
        
        <!-- Star glow filter -->
        <filter id="star-glow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <!-- Nebula gradients -->
        <radialGradient id="nebula1" cx="30%" cy="30%" r="50%" fx="30%" fy="30%">
          <stop offset="0%" stop-color="rgba(154,29,223,0.3)" />
          <stop offset="50%" stop-color="rgba(126,31,213,0.2)" />
          <stop offset="100%" stop-color="rgba(98,32,203,0)" />
        </radialGradient>
        <radialGradient id="nebula2" cx="70%" cy="60%" r="40%" fx="70%" fy="60%">
          <stop offset="0%" stop-color="rgba(21,152,207,0.25)" />
          <stop offset="60%" stop-color="rgba(27,135,173,0.15)" />
          <stop offset="100%" stop-color="rgba(33,117,139,0)" />
        </radialGradient>
        <radialGradient id="nebula3" cx="20%" cy="70%" r="30%" fx="20%" fy="70%">
          <stop offset="0%" stop-color="rgba(230,169,25,0.15)" />
          <stop offset="60%" stop-color="rgba(210,149,25,0.1)" />
          <stop offset="100%" stop-color="rgba(190,129,25,0)" />
        </radialGradient>
        <radialGradient id="nebula4" cx="75%" cy="25%" r="35%" fx="75%" fy="25%">
          <stop offset="0%" stop-color="rgba(23,185,120,0.15)" />
          <stop offset="60%" stop-color="rgba(23,165,110,0.1)" />
          <stop offset="100%" stop-color="rgba(23,145,100,0)" />
        </radialGradient>
        
        <!-- Hypergeometric pattern overlay -->
        <pattern id="hypergeometric" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="100" y2="100" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" />
          <line x1="100" y1="0" x2="0" y2="100" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" />
          <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
          <polygon points="50,10 90,50 50,90 10,50" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" />
        </pattern>
      </defs>
      
      <!-- Base cosmic background -->
      <rect width="100%" height="100%" fill="url(#cosmos-gradient)" />
      
      <!-- Hypergeometric overlay for subtle grid-like structure -->
      <rect width="100%" height="100%" fill="url(#hypergeometric)" opacity="0.3" />
      
      <!-- Nebula layer -->
      <g id="nebula-layer">
        <ellipse cx="30%" cy="30%" rx="50%" ry="40%" fill="url(#nebula1)" opacity="0.7" />
        <ellipse cx="70%" cy="60%" rx="45%" ry="35%" fill="url(#nebula2)" opacity="0.6" />
        <ellipse cx="20%" cy="70%" rx="35%" ry="25%" fill="url(#nebula3)" opacity="0.5" />
        <ellipse cx="75%" cy="25%" rx="40%" ry="30%" fill="url(#nebula4)" opacity="0.5" />
      </g>
      
      <!-- Stars layer (unchanged) -->
      <g id="stars-layer"></g>
      
      <!-- Complex Chaotic Geometry Layer -->
      <g id="chaotic-geometry">
        <!-- Populated via JavaScript below -->
      </g>
      
      <!-- Big Flower-of-Life Layer (6 big floating flowers) -->
      <g id="big-flowers">
        <!-- Populated via JavaScript below -->
      </g>
      
      <!-- JavaScript for dynamic stars, chaotic shapes, and big flowers -->
      <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
          const svg = document.querySelector('.cosmic-background');
          const width = window.innerWidth;
          const height = window.innerHeight;
          const starsLayer = document.getElementById('stars-layer');
          const chaosLayer = document.getElementById('chaotic-geometry');
          const bigFlowersLayer = document.getElementById('big-flowers');
          
          // Global mouse position
          let mouseX = width / 2, mouseY = height / 2;
          document.addEventListener('mousemove', function(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
          });
          
          // -----------------------------
          // STAR GENERATION (150 stars)
          // -----------------------------
          const stars = [];
          for (let i = 0; i < 150; i++) {
            const x = Math.random() * width;
            const y = Math.random() * height;
            const radius = Math.random() * 2 + 1;
            const baseOpacity = Math.random() * 0.5 + 0.5;
            
            const star = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            star.setAttribute("cx", x);
            star.setAttribute("cy", y);
            star.setAttribute("r", radius);
            star.setAttribute("fill", "white");
            star.setAttribute("opacity", baseOpacity);
            star.setAttribute("filter", "url(#star-glow)");
            star.dataset.x = x;
            star.dataset.y = y;
            star.dataset.baseOpacity = baseOpacity;
            star.dataset.baseRadius = radius;
            
            // Twinkling animation
            const animateStar = document.createElementNS("http://www.w3.org/2000/svg", "animate");
            animateStar.setAttribute("attributeName", "opacity");
            const originalDur = (Math.random() * 2 + 1) * 3;
            star.dataset.originalDur = originalDur;
            const maxOpacity = Math.min(1, baseOpacity * 2);
            animateStar.setAttribute("values", `${baseOpacity}; ${baseOpacity * 0.1}; ${maxOpacity}; ${baseOpacity}`);
            animateStar.setAttribute("dur", originalDur + "s");
            animateStar.setAttribute("repeatCount", "indefinite");
            star.appendChild(animateStar);
            
            stars.push(star);
            starsLayer.appendChild(star);
          }
          
          // Mouse proximity for stars: if within 150px, double the twinkling speed.
          let starScheduled = false;
          document.addEventListener('mousemove', function(e) {
            if (!starScheduled) {
              starScheduled = true;
              requestAnimationFrame(() => {
                stars.forEach(star => {
                  const starX = parseFloat(star.dataset.x);
                  const starY = parseFloat(star.dataset.y);
                  const dx = e.clientX - starX;
                  const dy = e.clientY - starY;
                  const distance = Math.sqrt(dx*dx + dy*dy);
                  const threshold = 150;
                  const animElem = star.firstElementChild;
                  const origDur = parseFloat(star.dataset.originalDur);
                  if (distance < threshold) {
                    animElem.setAttribute("dur", (origDur / 2) + "s");
                  } else {
                    animElem.setAttribute("dur", origDur + "s");
                  }
                });
                starScheduled = false;
              });
            }
          });
          
          // -----------------------------
          // CHAOTIC GEOMETRY SHAPES
          // -----------------------------
          // Palette for geometry (cosmic vibes)
          const geoPalette = ["#3a0ca3", "#4361ee", "#4cc9f0", "#7209b7"];
          
          // Function: create a random irregular polygon with one crossing line.
          function createChaoticPolygon() {
            const numVertices = Math.floor(Math.random() * 7) + 6; // 6-12 vertices
            let pts = [];
            const baseRadius = 30 + Math.random() * 20; // 30-50
            for (let i = 0; i < numVertices; i++) {
              const angle = (2 * Math.PI / numVertices) * i + (Math.random() - 0.5) * 0.4;
              const rad = baseRadius * (0.8 + Math.random() * 0.4);
              const x = rad * Math.cos(angle);
              const y = rad * Math.sin(angle);
              pts.push({x, y});
            }
            const pointsStr = pts.map(p => `${p.x},${p.y}`).join(" ");
            const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            polygon.setAttribute("points", pointsStr);
            const color = geoPalette[Math.floor(Math.random() * geoPalette.length)];
            polygon.setAttribute("stroke", color);
            polygon.setAttribute("fill", "none");
            polygon.setAttribute("stroke-width", "1");
            
            // Add one crossing line for extra complexity
            if (pts.length >= 6) {
              const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
              line.setAttribute("x1", pts[0].x);
              line.setAttribute("y1", pts[0].y);
              line.setAttribute("x2", pts[Math.floor(numVertices/2)].x);
              line.setAttribute("y2", pts[Math.floor(numVertices/2)].y);
              line.setAttribute("stroke", color);
              line.setAttribute("stroke-width", "0.5");
              polygon.parentNode && polygon.parentNode.appendChild(line);
              // Instead, we'll append it to the group later.
            }
            return polygon;
          }
          
          // Function: create a chaotic shape.
          // It is wrapped in an outer group (which orbits around the center) and an inner group (for optional self-rotation).
          function createChaoticShape(r, theta) {
            const cx = width / 2, cy = height / 2;
            const posX = cx + r * Math.cos(theta);
            const posY = cy + r * Math.sin(theta);
            const outer = document.createElementNS("http://www.w3.org/2000/svg", "g");
            // Random scale factor: 1x, 2x, 3x, or 4x.
            const scaleFactor = [1, 2, 3, 4][Math.floor(Math.random()*4)];
            outer.dataset.scale = scaleFactor;
            // Apply a random opacity between 0.1 and 0.35.
            outer.style.opacity = (Math.random() * (0.35 - 0.1) + 0.1).toFixed(2);
            // Set slower orbital speed: multiply base speed by a random factor chosen from [0.5, 0.33, 0.25, 0.2].
            const speedFactors = [0.5, 0.33, 0.25, 0.2];
            const chosenFactor = speedFactors[Math.floor(Math.random() * speedFactors.length)];
            outer.dataset.angularSpeed = ((Math.random() * 0.0002 + 0.0001) * chosenFactor);
            outer.dataset.r = r;
            outer.dataset.theta = theta;
            
            // Outer group transform includes translation and scaling.
            outer.setAttribute("transform", `translate(${posX}, ${posY}) scale(${scaleFactor})`);
            outer.dataset.centerX = posX;
            outer.dataset.centerY = posY;
            
            // Create inner group for chaotic polygon with self-rotation.
            const inner = document.createElementNS("http://www.w3.org/2000/svg", "g");
            // Initially, no self-rotation.
            inner.dataset.innerAngle = 0;
            inner.dataset.innerSpeed = 0;
            inner.dataset.lastInversion = Date.now();
            // Append a chaotic polygon
            const polygon = createChaoticPolygon();
            inner.appendChild(polygon);
            // Optionally add a crossing line (for extra complexity)
            // (This can be extended to add more internal lines if desired.)
            outer.appendChild(inner);
            outer._inner = inner; // store reference for later interaction
            return { outer, inner };
          }
          
          // Create 16 chaotic shapes (doubled from 8)
          const totalChaotic = 8;
          const chaoticShapes = [];
          for (let i = 0; i < totalChaotic; i++) {
            const r = 100 + Math.random() * (Math.min(width, height) / 2 - 100);
            const theta = Math.random() * 2 * Math.PI;
            const shapeObj = createChaoticShape(r, theta);
            chaoticShapes.push(shapeObj);
            chaosLayer.appendChild(shapeObj.outer);
          }
          
          // -----------------------------
          // BIG FLOWER-OF-LIFE PATTERNS
          // -----------------------------
          const bigFlowers = [];
          // Function: create a big flower-of-life pattern (7 circles)
          function createBigFlower(x, y, scale, baseColor) {
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            group.setAttribute("transform", `translate(${x}, ${y}) scale(${scale})`);
            group.dataset.x = x;
            group.dataset.y = y;
            // Assign random velocity: multiply base speed (0.2) by a random factor between 1 and 4.
            const speedFactor = Math.random() * 6 + 1;
            group.dataset.vx = (Math.random() - 0.5) * 0.2 * speedFactor;
            group.dataset.vy = (Math.random() - 0.5) * 0.2 * speedFactor;
            group.dataset.baseColor = baseColor;
            group.dataset.hue = 0; // for color shifting
            // Store scale for later use in interaction
            group.dataset.scale = scale;
            // Set a random opacity between 0.1 and 0.35.
            group.style.opacity = (Math.random() * (0.05 - 0.005) + 0.005).toFixed(2);
            const r = 20;
            const angles = [0, 60, 120, 180, 240, 300];
            function addCircle(cx, cy) {
              const circ = document.createElementNS("http://www.w3.org/2000/svg", "circle");
              circ.setAttribute("cx", cx);
              circ.setAttribute("cy", cy);
              circ.setAttribute("r", r);
              circ.setAttribute("fill", "none");
              circ.setAttribute("stroke", baseColor);
              circ.setAttribute("stroke-width", "1");
              group.appendChild(circ);
            }
            addCircle(0, 0);
            angles.forEach(angle => {
              const rad = angle * Math.PI / 180;
              const cx = r * Math.cos(rad);
              const cy = r * Math.sin(rad);
              addCircle(cx, cy);
            });
            return { group, baseColor };
          }
          
          // Use a palette of 6 distinct colors.
          const flowerPalette = ["#7209b7", "#3a0ca3", "#4361ee", "#4cc9f0", "#f72585", "#3a86ff"];
          const totalFlowers = 4;
          for (let i = 0; i < totalFlowers; i++) {
            const x = Math.random() * width;
            const y = Math.random() * height;
            const scale = 2 + Math.random() * 0.5 * 10;
            const color = flowerPalette[i % flowerPalette.length];
            const flower = createBigFlower(x, y, scale, color);
            bigFlowers.push(flower);
            bigFlowersLayer.appendChild(flower.group);
          }
          
          // -----------------------------
          // ANIMATION LOOP
          // -----------------------------
          let lastTime = performance.now();
          function animate() {
            const now = performance.now();
            const dt = now - lastTime;
            lastTime = now;
            
            // Update chaotic shapes: orbital motion around center.
            chaoticShapes.forEach(shapeObj => {
              const outer = shapeObj.outer;
              const r = parseFloat(outer.dataset.r);
              let theta = parseFloat(outer.dataset.theta);
              const angularSpeed = parseFloat(outer.dataset.angularSpeed);
              theta += angularSpeed * dt;
              outer.dataset.theta = theta;
              const cx = width / 2, cy = height / 2;
              const posX = cx + r * Math.cos(theta);
              const posY = cy + r * Math.sin(theta);
              // Include scaling in transform
              const scaleFactor = outer.dataset.scale;
              outer.setAttribute("transform", `translate(${posX}, ${posY}) scale(${scaleFactor})`);
              outer.dataset.centerX = posX;
              outer.dataset.centerY = posY;
              
              // Check mouse proximity (20px) to shape center.
              const dx = mouseX - posX;
              const dy = mouseY - posY;
              const distance = Math.sqrt(dx * dx + dy * dy);
              const inner = shapeObj.inner;
              let innerAngle = parseFloat(inner.dataset.innerAngle);
              let innerSpeed = parseFloat(inner.dataset.innerSpeed);
              if (distance < 200) {
                if (innerSpeed === 0) {
                  innerSpeed = 0.05; // start slow self-rotation
                  inner.dataset.innerSpeed = innerSpeed;
                  inner.dataset.lastInversion = now;
                }
                if (now - parseFloat(inner.dataset.lastInversion) > 1000) {
                  innerSpeed = -innerSpeed;
                  inner.dataset.innerSpeed = innerSpeed;
                  inner.dataset.lastInversion = now;
                }
              } else {
                innerSpeed *= 0.99;
                if (Math.abs(innerSpeed) < 0.001) {
                  innerSpeed = 0;
                }
                inner.dataset.innerSpeed = innerSpeed;
              }
              innerAngle += innerSpeed * dt;
              inner.dataset.innerAngle = innerAngle;
              inner.setAttribute("transform", `rotate(${innerAngle})`);
            });
            
            // Update big flowers: float slowly, shift color, and react to mouse proximity.
            bigFlowers.forEach(flowerObj => {
              const group = flowerObj.group;
              let x = parseFloat(group.dataset.x);
              let y = parseFloat(group.dataset.y);
              let vx = parseFloat(group.dataset.vx);
              let vy = parseFloat(group.dataset.vy);
              // Update position with their individual velocity.
              x += vx * dt * 0.05 * 2;
              y += vy * dt * 0.05 * 2;
              // Bounce off edges.
              if (x < 0 || x > width) { vx = -vx; }
              if (y < 0 || y > height) { vy = -vy; }
              group.dataset.x = x;
              group.dataset.y = y;
              group.dataset.vx = vx;
              group.dataset.vy = vy;
              const scale = group.dataset.scale || 1;
              group.setAttribute("transform", `translate(${x}, ${y}) scale(${scale})`);
              
              // Gradually shift color by updating hue.
              let hue = parseFloat(group.dataset.hue);
              hue = (hue + dt * 0.01) % 360;
              group.dataset.hue = hue;
              // Update stroke color of each circle in the flower.
              Array.from(group.children).forEach(child => {
                child.setAttribute("stroke", `hsl(${hue}, 60%, 70%)`);
              });
              
              // Determine threshold based on flower size: threshold = 20 * scale.
              const threshold = 20 * scale;
              const dx = mouseX - x;
              const dy = mouseY - y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < threshold) {
                const angle = Math.atan2(dy, dx);
                group.dataset.x = x - Math.cos(angle) * 0.5 * dt;
                group.dataset.y = y - Math.sin(angle) * 0.5 * dt;
              }
            });
            
            requestAnimationFrame(animate);
          }
          animate();
        });
      </script>
    </svg>
    
    <!-- Title container -->
    <div class="title-container">
      <h1 class="title">COSMOS EX MACHINA</h1>
      <p class="subtitle">DIGITAL UNIVERSE INTERVENTIONS</p>
    </div>
  </div>
</body>
</html>
